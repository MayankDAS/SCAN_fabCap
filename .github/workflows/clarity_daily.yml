name: Daily visitor metrics
on:
  schedule:
    - cron: "0 11,19 * * *"   # 11:00 and 19:00 UTC = 6:00 AM and 2:00 PM EST (7:00 AM and 3:00 PM during daylight saving)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/pull_clarity.py
        env:
          CLARITY_TOKEN: ${{ secrets.CLARITY_TOKEN }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
      - run: python scripts/build_metrics.py
      - run: |
          git config user.name "metrics-bot"; git config user.email "metrics-bot@users.noreply.github.com"
          git add data && (git diff --cached --quiet || git commit -m "Daily visitor metrics" && git push)
